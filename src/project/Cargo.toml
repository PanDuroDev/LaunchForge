[package]
name = "launchforge-project"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Phase 1 project persistence and schema validation for LaunchForge"

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "project_store"
path = "../../tests/project/project_store.rs"
