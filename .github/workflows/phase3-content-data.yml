name: Phase 3 content data checks

on:
  pull_request:
    paths:
      - "packages/content-data/**"
      - ".github/workflows/phase3-content-data.yml"
  push:
    branches: [main]
    paths:
      - "packages/content-data/**"

permissions:
  contents: read

jobs:
  content-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/content-data
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
