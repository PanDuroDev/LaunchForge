name: Phase 5 updater trust proposal checks

on:
  pull_request:
    paths:
      - "docs/LAUNCHER_UPDATE_TRUST_PROPOSAL.md"
      - "docs/LAUNCHER_UPDATE_CONFORMANCE_MATRIX.md"
      - ".github/workflows/phase5-updater-docs.yml"
  push:
    branches:
      - ai6/phase5-2-updater-trust-design

permissions:
  contents: read

jobs:
  validate-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate conformance IDs and release binding coverage
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          matrix = Path("docs/LAUNCHER_UPDATE_CONFORMANCE_MATRIX.md").read_text(encoding="utf-8")
          proposal = Path("docs/LAUNCHER_UPDATE_TRUST_PROPOSAL.md").read_text(encoding="utf-8")
          if "TUF), specification v1.0.36" not in proposal or "https://theupdateframework.github.io/specification/v1.0.36/" not in proposal:
              raise SystemExit("Updater proposal must pin the published TUF 1.0.36 specification.")
          ids = re.findall(r"^\|\s*([A-Z]{2,4}-\d+[A-Z]?)\s*\|", matrix, re.MULTILINE)
          if not ids:
              raise SystemExit("No conformance case IDs found.")
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate conformance IDs: {duplicates}")
          required_ids = {"TUF-010A", "TUF-010B", "TUF-010C", "TUF-015", "TUF-016", "REL-008", "REL-009", "REL-010"}
          missing = sorted(required_ids - set(ids))
          if missing:
              raise SystemExit(f"Missing trust/release coverage: {missing}")
          required_matrix_text = (
              "product/channel/platform/architecture/application version",
              "persist each cryptographically verified Root hop",
              "Accepted version-to-target binding is missing or corrupt",
              "do not reconstruct from remote metadata",
          )
          for phrase in required_matrix_text:
              if phrase not in matrix:
                  raise SystemExit(f"Missing required matrix assertion: {phrase}")
          required_proposal_text = (
              "custom.launchforge",
              "Targets custom metadata schema and POUF",
              "persists every verified Root hop before it reaches the final Root expiry check",
              "never reconstruct historical bindings from the current remote repository",
          )
          for phrase in required_proposal_text:
              if phrase not in proposal:
                  raise SystemExit(f"Missing required proposal assertion: {phrase}")
          print(f"Validated {len(ids)} unique updater conformance cases.")
          PY
