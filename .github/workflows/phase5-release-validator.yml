name: Phase 5 publisher release validation

on:
  pull_request:
    paths:
      - "tools/release/**"
      - "tests/release/**"
      - "schemas/publisher-artifact-inventory-v1.schema.json"
      - "docs/RELEASE_WORKFLOW.md"
      - ".github/workflows/phase5-release-validator.yml"
  push:
    branches:
      - ai6/phase5-1-publisher-release-workflow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile release validator and tests
        run: python -m py_compile tools/release/validate_inventory.py tests/release/test_validate_inventory.py
      - name: Run release validator tests
        run: python -m unittest discover -s tests/release -v
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate publisher inventory schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/publisher-artifact-inventory-v1.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("Publisher artifact inventory schema is valid Draft 2020-12.")
          PY
