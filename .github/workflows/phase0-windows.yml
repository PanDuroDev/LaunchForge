name: Phase 0 Windows spike

on:
  pull_request:
    paths:
      - "poc/**"
      - "scripts/measure-windows.ps1"
      - "docs/phase-0/**"
      - ".github/workflows/phase0-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run contract and renderer tests
        shell: pwsh
        run: node --test .\poc\tests\phase0.test.mjs

      - name: Build standalone renderer export
        shell: pwsh
        run: node .\poc\scripts\build-export.mjs

      - name: Resolve and validate the project application icon
        shell: pwsh
        run: node .\\poc\\scripts\\prepare-tauri-icon.mjs

      - name: Generate lockfile once and build Tauri with locked dependencies
        shell: pwsh
        run: |
          $manifest = ".\poc\src-tauri\Cargo.toml"
          $lockfile = ".\poc\src-tauri\Cargo.lock"
          if (-not (Test-Path $lockfile)) {
            cargo generate-lockfile --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo build --locked --release --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the standalone host process
        shell: pwsh
        run: |
          $app = Resolve-Path .\poc\src-tauri\target\release\launchforge_phase0_spike.exe
          $process = Start-Process -FilePath $app.Path -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Tauri host exited during the smoke-test window."
            }
            if ($process.MainWindowHandle -eq 0) {
              throw "Tauri host process stayed alive but did not expose a main window handle."
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      # The write token is exposed only to this trusted, same-repository Phase 0 branch step.
      - name: Commit the Windows-verified Cargo lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase0/de-risk-architecture'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .\poc\src-tauri\Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock is already committed."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git commit -m "build(phase0): commit Windows-verified Cargo.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $token = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $token" push origin "HEAD:$env:GITHUB_HEAD_REF"

      - name: Package portable spike
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "LaunchForge-Phase0-Portable"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item .\poc\src-tauri\target\release\launchforge_phase0_spike.exe $package
          Copy-Item .\poc\dist\BUILD-METADATA.json $package
          Copy-Item .\poc\src-tauri\Cargo.lock (Join-Path $package "Cargo.lock")
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "LaunchForge-Phase0-Portable.zip") -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchforge-phase0-windows-portable
          path: ${{ runner.temp }}\LaunchForge-Phase0-Portable.zip
          if-no-files-found: error
