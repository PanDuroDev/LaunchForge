name: Phase 4 transaction and lifecycle prototype

on:
  pull_request:
    branches: [main]
    paths:
      - "prototypes/phase4_2_3/**"
      - "docs/contracts/game-install-transaction-v1.md"
      - "docs/contracts/game-runtime-lifecycle-v1.md"
      - "docs/PHASE4_THREAT_MODEL.md"
      - ".github/workflows/phase4-transaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-tests:
    name: POSIX filesystem tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package and tests
        working-directory: prototypes/phase4_2_3
        run: python -m compileall -q launchforge_delivery tests
      - name: Run adversarial transaction and lifecycle tests
        working-directory: prototypes/phase4_2_3
        run: python -m unittest discover -s tests -v
